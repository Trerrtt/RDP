name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP & Firewall
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: Create RDP User
        run: |
          $P=[char[]](33..126)|Get-Random -Count 12 -join ''; $S=ConvertTo-SecureString $P -AsPlainText -Force
          New-LocalUser -Name RDP -Password $S -AccountNeverExpires
          Add-LocalGroupMember Administrators,RDP; Add-LocalGroupMember "Remote Desktop Users","RDP"
          echo "RDP_CREDS=User: RDP | Password: $P" >> $env:GITHUB_ENV

      - name: Install & Connect Tailscale
        run: |
          $url="https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $tmp="$env:TEMP\tailscale.msi"
          Invoke-WebRequest $url -OutFile $tmp
          Start-Process msiexec.exe -ArgumentList "/i","`"$tmp`"","/quiet","/norestart" -Wait
          Remove-Item $tmp -Force
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $IP=$(& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 | Select-Object -First 1)
          echo "TAILSCALE_IP=$IP" >> $env:GITHUB_ENV

      - name: Verify RDP
        run: |
          $r=Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $r.TcpTestSucceeded) { Write-Error "RDP not reachable"; exit 1 }
          Write-Host "RDP reachable at $env:TAILSCALE_IP"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_CREDS"
          Write-Host "==================`n"
          while ($true) { Write-Host "[$(Get-Date)] RDP Active"; Start-Sleep 300 }

