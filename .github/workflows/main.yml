name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Update & Install XRDP
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xrdp xfce4 xfce4-goodies dbus-x11 x11-xserver-utils net-tools

          # Enable XRDP service
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Create RDP User with Secure Password
        run: |
          PASS=$(openssl rand -base64 12)
          sudo useradd -m -s /bin/bash rdp
          echo "rdp:$PASS" | sudo chpasswd
          sudo usermod -aG sudo rdp

          echo "RDP_USER=rdp" >> $GITHUB_ENV
          echo "RDP_PASS=$PASS" >> $GITHUB_ENV

      - name: Fix XRDP Config
        run: |
          echo "startxfce4" | sudo tee /home/rdp/.xsession
          sudo chown rdp:rdp /home/rdp/.xsession

          # Allow RDP port
          sudo ufw allow 3389/tcp || true

          # Restart XRDP
          sudo systemctl restart xrdp

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID

          TS_IP=$(tailscale ip -4 | head -n1)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          echo "Username: $RDP_USER"
          echo "Password: $RDP_PASS"

          # Check XRDP is listening
          sudo netstat -tulpn | grep 3389 || echo "XRDP not bound correctly"

          # Test connectivity
          nc -zv $TAILSCALE_IP 3389 || (echo "RDP port not reachable" && exit 1)

      - name: Show RDP Connection Info
        run: |
          echo -e "\n=== RDP ACCESS ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: $RDP_USER"
          echo "Password: $RDP_PASS"
          echo "==================\n"

          echo "⚡ Keep this job running until timeout (3600 minutes)."
